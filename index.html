<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <title>Sponsor Tracker · Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f4f4f4;--panel:#fafafa;--ink:#0a0a0a;--ink-2:#565656;--line:#c8c8c8;--err:#a40000;--font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--font-body:"Hanken Grotesk","Segoe UI",system-ui,sans-serif}
    @media(prefers-color-scheme:dark){:root{--bg:#000;--panel:#161616;--ink:#f2f2f2;--ink-2:#a0a0a0;--line:#2a2a2a;--err:#ff8a8a}}
    *,*::before,*::after{box-sizing:border-box} [hidden]{display:none!important}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
    body{min-height:100dvh;display:grid;place-items:center;padding:calc(2rem + env(safe-area-inset-top,0px)) max(1.5rem,env(safe-area-inset-right,0px)) calc(2rem + env(safe-area-inset-bottom,0px)) max(1.5rem,env(safe-area-inset-left,0px));}
    .gate-inner{width:100%;max-width:22rem;animation:rise .5s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){.gate-inner{animation:none}}
    h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,7vw,2.55rem);line-height:1.02;letter-spacing:-.045em;margin:0 0 .65rem}
    .tagline{font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:var(--ink-2);margin:0 0 .45rem}
    .subline{font-size:.9rem;color:var(--ink-2);margin:0 0 2rem;line-height:1.5}
    .checking{color:var(--ink-2);font-weight:600}
    .modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:1.35rem}
    .modes button{font:inherit;font-weight:700;font-size:.95rem;min-height:46px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;touch-action:manipulation}
    .modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.modes button:disabled{opacity:.4;cursor:not-allowed}
    form{text-align:left}label{display:block;font-weight:700;font-size:.9rem;margin:0 0 1rem}
    .field{position:relative;margin-top:.35rem}
    input{width:100%;font:inherit;font-weight:500;font-size:1rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem;min-height:49px}
    input:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
    .field input[type=password],.field input.shown{padding-right:4.5rem}
    .toggle{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);font:inherit;font-size:.85rem;font-weight:700;min-height:36px;padding:0 .65rem;background:transparent;color:var(--ink-2);border:0;border-radius:8px;cursor:pointer}
    .help{display:block;font-weight:500;font-size:.85rem;color:var(--ink-2);margin-top:.4rem}
    .error{color:var(--err);font-weight:600;font-size:.95rem;margin:0 0 .85rem;min-height:1.2em}
    .note{color:var(--ink-2);font-size:.9rem;margin:1rem 0 0;text-align:center;line-height:1.5}
    .enter{width:100%;font:inherit;font-weight:700;font-size:1rem;color:var(--bg);background:var(--ink);border:0;border-radius:10px;padding:.9rem 2rem;min-height:53px;cursor:pointer;touch-action:manipulation;transition:transform .12s ease-out,opacity .12s ease-out}
    .enter:active{transform:scale(.98);opacity:.9}.enter:disabled{opacity:.55;cursor:wait}
    body.leaving{animation:fadeOut .32s ease-out forwards}@keyframes fadeOut{to{opacity:0;transform:translateY(-4px)}}
    @media(prefers-reduced-motion:reduce){body.leaving{animation-duration:.01ms}}
    .gate-logo{
  display:block;
  width:72px;height:72px;
  margin:0 auto 1rem;
  border-radius:14px;
}
  </style>
</head>
<body>
 <main class="gate-inner">
    <img class="gate-logo" src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1>Sponsor Tracker</h1>
    <p class="tagline">sankalpa 1.0</p>
    <p class="checking" id="checking" role="status">Checking sign-in…</p>
    <section id="auth" hidden>
      <div class="modes" role="group" aria-label="Sign in or create an account">
        <button type="button" id="tl" aria-pressed="true">Sign in</button>
        <button type="button" id="ts" aria-pressed="false">Create account</button>
      </div>
      <form id="f" novalidate>
        <label for="e">Email
          <span class="field"><input id="e" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" required></span>
        </label>
        <label for="p">Password
          <span class="field">
            <input id="p" name="password" type="password" autocomplete="current-password" required>
            <button class="toggle" id="toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </span>
          <span class="help" id="pwHelp" hidden>At least 8 characters.</span>
        </label>
        <label for="c" id="cr" hidden>Invite code
          <span class="field"><input id="c" name="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"></span>
        </label>
        <p class="error" id="err" role="alert"></p>
        <button class="enter" id="go" type="submit">Sign in</button>
      </form>
      <p class="note" id="n" aria-live="polite"></p>
    </section>
  </main>
  <script>
    (function(){
      var $=function(id){return document.getElementById(id)};
      var mode='login',info={slotsLeft:null,needsCode:false,signupOpen:true};
      function draw(){
        var su=mode==='signup';
        $('tl').setAttribute('aria-pressed',String(!su));$('ts').setAttribute('aria-pressed',String(su));
        $('go').textContent=su?'Create account':'Sign in';$('p').autocomplete=su?'new-password':'current-password';
        $('pwHelp').hidden=!su;$('cr').hidden=!(su&&info.needsCode);$('err').textContent='';
        var full=info.slotsLeft===0||!info.signupOpen;$('ts').disabled=full;
        if(full&&su){mode='login';draw();return;}
        $('n').textContent=info.slotsLeft===null?(full?'All 10 spots are taken.':(su?'Passwords need 8+ characters.':'')):full?'All 10 spots are taken.':su?info.slotsLeft+' of 10 spots left. Passwords need 8+ characters.':'';
      }
      $('tl').addEventListener('click',function(){mode='login';draw()});
      $('ts').addEventListener('click',function(){mode='signup';draw()});
      $('toggle').addEventListener('click',function(){var pw=$('p'),show=pw.type==='password';pw.type=show?'text':'password';pw.classList.toggle('shown',show);this.textContent=show?'Hide':'Show';this.setAttribute('aria-pressed',String(show));this.setAttribute('aria-label',show?'Hide password':'Show password')});
      $('f').addEventListener('submit',async function(e){
        e.preventDefault();var em=$('e').value.trim(),pw=$('p').value;$('err').textContent='';
        if(!em||!pw){$('err').textContent='Enter your email and password.';return;}
        if(mode==='signup'&&pw.length<8){$('err').textContent='Password must be at least 8 characters.';return;}
        if(!navigator.onLine){$('err').textContent='You’re offline. Connect to sign in.';return;}
        var btn=$('go'),label=btn.textContent;btn.disabled=true;btn.textContent=mode==='signup'?'Creating…':'Signing in…';
        try{var r=await fetch('/api/'+(mode==='signup'?'signup':'login'),{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw,code:$('c').value.trim()})});var j=await r.json().catch(function(){return {}});if(r.ok&&j.user){document.body.classList.add('leaving');setTimeout(function(){location.replace('/app.html')},320);return;}$('err').textContent=j.error||'Something went wrong. Try again.';}
        catch(err){$('err').textContent='Could not reach the server. Check your connection.';}
        btn.disabled=false;btn.textContent=label;
      });
      fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('status');return r.json()}).then(function(m){if(m.user){location.replace('/app.html');return;}info={slotsLeft:m.slotsLeft??(m.signupOpen?null:0),needsCode:!!m.needsCode,signupOpen:m.signupOpen!==false};$('checking').hidden=true;$('auth').hidden=false;draw();if(/[?&]expired=1/.test(location.search))$('err').textContent='Your session ended. Sign in again.';}).catch(function(){$('checking').textContent='Could not reach the server. Check your connection and reload.';$('auth').hidden=false;draw();});
    })();
  </script>
</body>
</html>
