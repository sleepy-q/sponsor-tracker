<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex"/><title>Sponsor Tracker · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#f7f7f8;--surface:#fff;--border:#e2e2e6;--text:#111113;--muted:#6b6b7b;--violet:#7c3aed;--err:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--surface:#1a1a1a;--border:#2a2a2e;--text:#f0f0f2;--muted:#88889a;--err:#ef4444}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px 'DM Sans',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:26px}
h1{font:700 22px 'Playfair Display',Georgia,serif}p.s{color:var(--muted);margin:4px 0 18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px}
.tabs button{padding:10px;border:0;background:none;color:var(--muted);font:600 13px inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--violet);color:#fff}.tabs button:disabled{opacity:.4}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:16px inherit;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.go{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--violet);color:#fff;font:600 14px inherit;cursor:pointer}.go:disabled{opacity:.6}
.err{color:var(--err);min-height:1.2em;margin-top:12px;font-weight:500}.note{color:var(--muted);text-align:center;margin-top:10px;font-size:12px}
</style></head><body>
<div class="box"><h1>Sponsor Tracker</h1><p class="s" id="chk">Checking sign-in…</p>
<div id="auth" hidden>
<div class="tabs"><button id="tl" aria-pressed="true">Sign in</button><button id="ts" aria-pressed="false">Create account</button></div>
<form id="f" novalidate>
<label for="e">Email</label><input id="e" type="email" autocomplete="email" autocapitalize="none" required/>
<label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required/>
<div id="cr" hidden><label for="c">Invite code</label><input id="c" autocomplete="off" autocapitalize="none"/></div>
<p class="err" id="err" role="alert"></p><button class="go" id="go">Sign in</button></form>
<p class="note" id="n"></p></div></div>
<script>
const $=id=>document.getElementById(id);let mode='login',info={slotsLeft:null,needsCode:false,signupOpen:true};
function draw(){
  const su=mode==='signup';
  $('tl').setAttribute('aria-pressed',!su);
  $('ts').setAttribute('aria-pressed',su);
  $('go').textContent=su?'Create account':'Sign in';
  $('p').autocomplete=su?'new-password':'current-password';
  $('cr').hidden=!(su&&info.needsCode);
  const full=info.slotsLeft===0||!info.signupOpen;
  $('ts').disabled=full;
  $('n').textContent=info.slotsLeft===null
    ? (full?'All 10 spots are taken.':(su?'Passwords need 8+ characters.':''))
    : full
      ? 'All 10 spots are taken.'
      : su
        ? info.slotsLeft+' of 10 spots left. Passwords need 8+ characters.'
        : '';
  $('err').textContent='';
}
$('tl').onclick=()=>{mode='login';draw()};$('ts').onclick=()=>{mode='signup';draw()};
$('f').onsubmit=async e=>{
  e.preventDefault();
  const em=$('e').value.trim(),pw=$('p').value;
  if(!em||!pw){$('err').textContent='Enter your email and password.';return}
  $('go').disabled=true;
  try{
    const r=await fetch('/api/'+(mode==='signup'?'signup':'login'),{
      method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:em,password:pw,code:$('c').value.trim()})
    });
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.user){location.replace('/app.html');return}
    $('err').textContent=j.error||'Something went wrong.';
  }catch{$('err').textContent='Could not reach the server.'}
  $('go').disabled=false;
};
fetch('/api/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.json()).then(m=>{
  if(m.user){location.replace('/app.html');return}
  info={
    slotsLeft:m.slotsLeft??(m.signupOpen?null:0),
    needsCode:m.needsCode,
    signupOpen:m.signupOpen!==false,
  };
  $('chk').textContent='Sign in to see the shared list.';
  $('auth').hidden=false;
  draw();
  if(/expired=1/.test(location.search))$('err').textContent='Your session ended. Sign in again.';
}).catch(()=>{$('chk').textContent='Could not reach the server.'});
</script></body></html>
